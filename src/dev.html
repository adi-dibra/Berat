<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Manager (dev harness)</title>
    <style>
      body { display: flex; }
      #strip { flex: 1; overflow: auto; height: 100vh; padding: 8px; background: #f8f9fa; color: #333; border-right: 1px solid #ddd; font: 12px system-ui, sans-serif; }
      #strip h3 { margin: 4px 0 8px; font-size: 13px; }
      #strip .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 4px; border-left: 4px solid transparent; }
      #strip .t.active { font-weight: 700; }
      #panel { width: 380px; flex: none; height: 100vh; }
      body.shot { background: linear-gradient(135deg, #1a73e8, #0b3d91); align-items: center; justify-content: center; gap: 64px; }
      body.shot #strip { flex: 0 0 520px; height: auto; overflow: visible; background: none; border: 0; color: #fff; font: 600 44px/1.15 system-ui, sans-serif; padding: 0; }
      body.shot #strip p { font: 400 22px/1.4 system-ui, sans-serif; opacity: .9; margin-top: 18px; }
      body.shot #panel { width: 420px; height: 720px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
      body.shot #panel > #app { height: 720px; }
    </style>
  </head>
  <body>
    <div id="strip"></div>
    <div id="panel"><div id="app"></div></div>
    <script type="module" src="./mock/devHarness.ts"></script>
  </body>
</html>
